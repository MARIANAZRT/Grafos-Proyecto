        <div class="card" style="width: 100%">

        <script type="text/javascript">

              // initialize global variables.
              var edges;
              var nodes;
              var allNodes;
              var allEdges;
              var nodeColors;
              var originalNodes;
              var network;
              var container;
              var options, data;
              var filter = {
                  item : '',
                  property : '',
                  value : []
              };

              

              

              // This method is responsible for drawing the graph, returns the drawn network
              function drawGraph() {
                  var container = document.getElementById('mynetwork');

                  

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"color": "#4aa3df", "font": {"color": "white"}, "id": "1", "label": "1", "shape": "dot", "size": 25, "title": "V\u00e9rtice: 1"}, {"color": "#4aa3df", "font": {"color": "white"}, "id": "2", "label": "2", "shape": "dot", "size": 25, "title": "V\u00e9rtice: 2"}, {"color": "#4aa3df", "font": {"color": "white"}, "id": "3", "label": "3", "shape": "dot", "size": 25, "title": "V\u00e9rtice: 3"}, {"color": "#4aa3df", "font": {"color": "white"}, "id": "4", "label": "4", "shape": "dot", "size": 25, "title": "V\u00e9rtice: 4"}, {"color": "#4aa3df", "font": {"color": "white"}, "id": "5", "label": "5", "shape": "dot", "size": 25, "title": "V\u00e9rtice: 5"}, {"color": "#4aa3df", "font": {"color": "white"}, "id": "6", "label": "6", "shape": "dot", "size": 25, "title": "V\u00e9rtice: 6"}]);
                  edges = new vis.DataSet([{"color": "#747d8c", "from": "1", "to": "3", "width": 1.5}, {"color": "#ff4757", "from": "1", "title": "EMPAREJADO", "to": "5", "width": 5}, {"color": "#747d8c", "from": "2", "to": "4", "width": 1.5}, {"color": "#ff4757", "from": "2", "title": "EMPAREJADO", "to": "6", "width": 5}, {"color": "#ff4757", "from": "3", "title": "EMPAREJADO", "to": "4", "width": 5}, {"color": "#747d8c", "from": "3", "to": "6", "width": 1.5}, {"color": "#747d8c", "from": "4", "to": "5", "width": 1.5}, {"color": "#747d8c", "from": "5", "to": "6", "width": 1.5}]);

                  nodeColors = {};
                  allNodes = nodes.get({ returnType: "Object" });
                  for (nodeId in allNodes) {
                    nodeColors[nodeId] = allNodes[nodeId].color;
                  }
                  allEdges = edges.get({ returnType: "Object" });
                  // adding nodes and edges to the graph
                  data = {nodes: nodes, edges: edges};

                  var options = {
    "configure": {
        "enabled": false
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};

                  


                  

                  network = new vis.Network(container, data, options);

                  

                  

                  


                  

                  return network;

              }
              drawGraph();
        </script>

    <script>
    function descargarReporte() {
        const contenido = `======================================\n` +
                          `       REPORTE DEL GRAFO G = (V, A)   \n` +
                          `======================================\n` +
                          `Tipo de Grafo : No dirigido (Graph)\n` +
                          `Num Vértices  : 6\n` +
                          `Num Aristas   : 8\n\n` +
                          `EMPAREJAMIENTO ÓPTIMO:\n` +
                          ` - 5 <---> 1
 - 6 <---> 2
 - 4 <---> 3\n`;
                          
        const blob = new Blob([contenido], { type: 'text/plain;charset=utf-8' });
        const enlace = document.createElement('a');
        enlace.href = URL.createObjectURL(blob);
        enlace.download = 'reporte_grafo.txt';
        enlace.click();
    }
    </script>
